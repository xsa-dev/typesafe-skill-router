name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest==8.3.4 pyyaml==6.0.2
      - name: Run the offline suite
        # No API key, no network: every test drives the real router with a scripted client.
        run: python -m pytest

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.2
      - name: Structural manifest check
        # The authoritative gate (`hermes plugins validate`) runs in the catalog's own CI on
        # the pinned sha; this keeps the manifest honest on every push without that install.
        run: |
          python - <<'PY'
          import re, sys, yaml, pathlib
          manifest = yaml.safe_load(pathlib.Path("plugin.yaml").read_text())
          errors = []
          for key in ("name", "version", "description"):
              if not str(manifest.get(key, "")).strip():
                  errors.append(f"plugin.yaml is missing {key}")
          if not re.fullmatch(r"[a-z0-9_-]{1,64}", str(manifest.get("name", ""))):
              errors.append("name must match [a-z0-9_-]{1,64}")
          spec = str(manifest.get("requires_hermes", "") or "")
          for clause in filter(None, (c.strip() for c in spec.split(","))):
              if not re.fullmatch(r"(>=|<=|==|!=|>|<)\s*\d+(\.\d+)*", clause):
                  errors.append(f"requires_hermes clause {clause!r} is malformed")
          for entry in manifest.get("requires_env", []) or []:
              if not re.fullmatch(r"[A-Z0-9_]+", str(entry)):
                  errors.append(f"requires_env entry {entry!r} is not UPPER_SNAKE")
          hooks = manifest.get("provides_hooks", []) or []
          if hooks != ["pre_llm_call"]:
              errors.append(f"provides_hooks changed: {hooks}")
          print("\n".join(errors) or "manifest ok")
          sys.exit(1 if errors else 0)
          PY
